name: fluttersdk_wind_diagnostics_contracts
description: Pure abstract contracts for Wind UI diagnostic introspection. Bridge between Wind and debug-tooling packages (e.g., fluttersdk_dusk) without compile-time coupling.
version: 1.0.0-alpha.1
homepage: https://wind.fluttersdk.com/diagnostics_contracts

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
